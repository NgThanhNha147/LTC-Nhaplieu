spring:
  application:
    name: dynamic-form-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dynamic_forms}
    username: ${DB_USERNAME:dynamic_forms}
    password: ${DB_PASSWORD:dynamic_forms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app_meta
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    user:
      name: ${APP_USERNAME:admin}
      password: ${APP_PASSWORD:admin}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
  storage:
    path: ${DOCUMENT_STORAGE_PATH:./data/documents}
  ocr:
    enabled: ${OCR_ENABLED:false}
    service-url: ${OCR_SERVICE_URL:http://localhost:8090}
  export:
    max-rows: ${EXPORT_MAX_ROWS:10000}

logging:
  level:
    com.example.dynamicform: INFO
