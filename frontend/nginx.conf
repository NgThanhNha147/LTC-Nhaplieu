server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 30m;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Browser calls the API through this same-origin gateway. Do not forward the
    # public tunnel origin to Spring, whose CORS policy is reserved for direct
    # local-development calls.
    proxy_set_header Origin "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The bundled PDF worker uses .mjs, which is not present in Alpine's
  # default mime.types. Keep the standard MIME map and handle only .mjs here.
  location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
